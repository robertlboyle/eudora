# Builds and tests Eudora on every push and pull request, on GitHub's Windows, Mac, and Linux
# machines, and keeps each build's packages as the run's artifacts (Actions ▸ the run ▸
# Artifacts): the Windows installers (x64 and ARM64), the Mac disk image (Apple silicon and
# Intel), and the Linux AppImage, .deb, and .rpm (x86-64 and ARM64).
#
# These builds are unsigned and carry no sign-in registrations or update server (BUILDING.md,
# "Settings for a build of your own"): for trying the code, not for release.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # no network calls to an update server from tests
  EUDORA_UPDATE_URL: ""

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/setup-linux.sh --yes
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  windows:
    name: Windows installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: eudora-windows-${{ matrix.arch }}
          path: dist/Eudora-Setup-*.exe
          if-no-files-found: error

  mac:
    name: Mac disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the disk image (unsigned)
        run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eudora-mac
          path: dist/Eudora-*.dmg
          if-no-files-found: error

  linux:
    name: Linux packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the AppImage, .deb, and .rpm (in Docker)
        run: python3 scripts/build_linux.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: eudora-linux-${{ matrix.arch }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
