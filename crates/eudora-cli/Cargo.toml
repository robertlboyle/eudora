[package]
name = "eudora-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# The command-line tool: `eudora-cli` (the window is `eudora`).
[[bin]]
name = "eudora-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
eudora-core = { version = "1.0.1", path = "../eudora-core" }
eudora-testkit = { version = "1.0.1", path = "../eudora-testkit" }
serde_json = "1.0.151"
