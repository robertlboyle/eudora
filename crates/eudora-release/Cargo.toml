[package]
name = "eudora-release"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Signs releases for Eudora's updates (eudora-core/src/update.rs): `keygen` once, `publish` per
# release. A tool for whoever releases Eudora; never shipped.
[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
ring = "0.17.14"
serde_json = "1.0.151"
sha2 = "0.11.0"
