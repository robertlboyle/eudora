[package]
name = "eudora-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Synthetic mail corpora for tests and benchmarks: deterministic (same seed = same bytes on any
# computer), so it uses its own small random generator instead of a crate whose output may
# change between versions.
[dependencies]
chrono = "0.4.45"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
