[package]
name = "eudora-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# The web interface (phones and other computers): `eudora-web`. HTTPS only, a password and
# passkeys, the same library as the desktop viewer.
[[bin]]
name = "eudora-web"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
chrono = "0.4.45"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
eudora-core = { version = "0.1.0", path = "../eudora-core" }
getrandom = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
